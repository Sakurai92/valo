<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VALORANT エージェントランダム選択</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="agent-pick.css">
</head>
<body>

  <div id="screen-loading" class="screen active">
    <div class="spinner"></div>
    <p>データを読み込み中…</p>
  </div>

  <div id="screen-setup" class="screen">
    <div class="setup-scroll">
      <a href="index.html" class="btn-home">← ホーム</a>
      <p class="label">VALORANT</p>
      <h1>エージェントランダム選択</h1>

      <div class="setup-cols">
        <div class="setup-left">
          <div class="section">
            <p class="section-title">人数</p>
            <div class="count-btns" id="count-btns">
              <button class="count-btn active" data-n="1">1</button>
              <button class="count-btn" data-n="2">2</button>
              <button class="count-btn" data-n="3">3</button>
              <button class="count-btn" data-n="4">4</button>
              <button class="count-btn" data-n="5">5</button>
            </div>
          </div>

          <div class="section">
            <p class="section-title">プレイヤー名（省略可）</p>
            <div id="name-inputs" class="name-inputs"></div>
          </div>
        </div>

        <div class="setup-right">
          <div class="section">
            <p class="section-title">対象エージェント</p>
            <div id="role-filter" class="role-filter"></div>
            <div id="agent-chips" class="agent-chips"></div>
            <p id="filter-count" class="filter-count"></p>
          </div>
        </div>
      </div>

      <button id="btn-pick" class="btn-primary">ランダムピック！</button>
    </div>
  </div>

  <div id="screen-result" class="screen">
    <div class="result-scroll">
      <div class="result-top">
        <a href="index.html" class="btn-home">← ホーム</a>
      </div>
      <div id="pick-cards" class="pick-cards"></div>
      <div class="result-actions">
        <button id="btn-repick" class="btn-primary">もう一度</button>
        <button id="btn-back" class="btn-back">設定に戻る</button>
      </div>
    </div>
  </div>

  <script src="agent-pick.js"></script>
</body>
</html>
